<!doctype html>
<html lang="ru" data-bg="black" data-accent="gold" data-texture="vignette"
      data-glow="on" data-corners="soft" data-density="cozy" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Sayumi — локальный рабочий интерфейс: чат, заметки, задачи и файлы.">
<title>Sayumi</title>
<link rel="icon" href="assets/sayumi-icon.png">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="bgfx"></div>

<header class="topbar">
  <div class="brand">
    <img src="assets/sayumi-icon.png" alt="">
    <div>
      <b id="brand-name">Sayumi</b><br>
      <small>рабочее пространство</small>
    </div>
  </div>

  <nav class="topnav">
    <button class="btn ghost" id="nav-chat">
      <svg class="ic" viewBox="0 0 16 16"><path d="M2.2 3.4h11.6v7.2H6.4l-4.2 3z"/></svg><span>Чат</span>
    </button>
    <button class="btn ghost" id="nav-notes">
      <svg class="ic" viewBox="0 0 16 16"><path d="M4 2.2h8v11.6H4z"/><path d="M6 5.4h4M6 8h4M6 10.6h2.4"/></svg><span>Заметки</span>
    </button>
    <button class="btn ghost" id="nav-tasks">
      <svg class="ic" viewBox="0 0 16 16"><path d="M2.4 5l1.8 1.8L7.4 3"/><path d="M2.4 11.4l1.8 1.8 3.2-3.8"/><path d="M9.6 5.6h4M9.6 11.8h4"/></svg><span>Задачи</span>
    </button>
    <button class="btn ghost" id="nav-files">
      <svg class="ic" viewBox="0 0 16 16"><path d="M2 4.2h3.8L7.4 6.3H14v7.5H2z"/></svg><span>Файлы</span>
    </button>
  </nav>

  <div class="brand" style="border:0;gap:7px;padding:0">
    <span class="dot off" id="srv-dot"></span>
    <small id="srv-text" class="tiny muted">...</small>
  </div>

  <button class="btn icon ghost" id="btn-search" title="Поиск по всему  ·  Ctrl + K">
    <svg class="ic" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4L14 14"/></svg>
  </button>

  <button class="btn icon ghost" id="btn-persona" title="Настройки Sayumi">
    <svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="5.4" r="2.6"/><path d="M2.6 13.8c.6-3 2.8-4.5 5.4-4.5s4.8 1.5 5.4 4.5"/></svg>
  </button>

  <button class="btn icon" id="btn-settings" title="Настройки проекта">
    <svg class="ic" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="2.4"/>
      <path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/>
    </svg>
  </button>
</header>

<main id="stage">
  <div class="welcome">
    <h1>Sayumi</h1>
    <p>Нажмите на неё — откроется чат. Правая кнопка — её настройки.</p>
    <p>Её можно перетащить в любое место экрана.</p>
    <p style="margin-top:14px"><kbd>Ctrl</kbd> + <kbd>/</kbd> чат &nbsp;·&nbsp;
       <kbd>Ctrl</kbd> + <kbd>,</kbd> настройки проекта &nbsp;·&nbsp;
       <kbd>Ctrl</kbd> + <kbd>.</kbd> настройки Sayumi</p>
  </div>
</main>

<div id="windows"></div>

<div class="avatar" id="avatar" title="Левая кнопка — чат, правая — настройки">
  <div class="aura"></div>
  <canvas class="dust"></canvas>
  <div class="bubble"></div>
  <img class="figure" src="assets/sayumi.png" alt="Sayumi">
  <img class="blink" alt="">
  <div class="tag">Sayumi</div>
</div>

<footer class="statusbar" id="statusbar">
  <div class="seg act" id="st-server" title="Состояние локального сервера">
    <span class="dot off" id="st-dot"></span><b id="st-server-text">—</b>
  </div>
  <div class="seg act hide-sm" id="st-model" title="Настройки модели">—</div>
  <div class="seg hide-sm" id="st-ctx" title="Объём текущего диалога">—</div>
  <div class="seg act hide-sm" id="st-work" title="Заметки и задачи">—</div>
  <div class="seg act hide-sm" id="st-mem" title="Память и уровень">—</div>
  <div class="seg grow"></div>
  <div class="seg hide-sm" id="st-theme" title="Текущее оформление">—</div>
  <div class="seg" id="st-clock">--:--</div>
</footer>

<div id="toasts"></div>

<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/migrate.js"></script>
<script src="js/dialog.js"></script>
<script src="js/theme.js"></script>
<script src="js/menu.js"></script>
<script src="js/markdown.js"></script>
<script src="js/windows.js"></script>
<script src="js/persona.js"></script>
<script src="js/memory.js"></script>
<script src="js/codebase.js"></script>
<script src="js/links.js"></script>
<script src="js/search.js"></script>
<script src="js/chat.js"></script>
<script src="js/tools.js"></script>
<script src="js/settings.js"></script>
<script src="js/avatar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
